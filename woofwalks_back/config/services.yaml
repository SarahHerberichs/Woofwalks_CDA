# # This file is the entry point to configure your own services.
# # Files in the packages/ subdirectory configure your dependencies.

# # Put parameters here that don't need to change on each machine where the app is deployed
# # https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
# parameters:



#     # makes classes in src/ available to be used as services
#     # this creates a service per class whose id is the fully-qualified class name
#     App\:
#         resource: '../src/'
#         exclude:
#             - '../src/DependencyInjection/'
#             - '../src/Entity/'
#             - '../src/Kernel.php'

#     # add more service definitions when explicit configuration is needed
#     # please note that last definitions always *replace* previous ones
parameters:
  uploads_directory: "%kernel.project_dir%/public/uploads" # Définir le chemin du répertoire de téléchargement
services:
  _defaults:
    autowire: true # Autowiring permet à Symfony d'injecter automatiquement les dépendances
    autoconfigure: true #
    public: false
    
  App\:
    resource: '../src/*'
    exclude:
        - '../src/DependencyInjection/'
        - '../src/Entity/'
        - '../src/Kernel.php'
  App\Security\Extractor\CookieTokenExtractor:
    arguments:
      $cookieName: 'BEARER' # Nom du cookie où tu stockes le token JWT
    tags:
      - { name: lexik_jwt_authentication.token_extractor, priority: 50 }
  App\Security\CookieTokenAuthenticator:
    arguments:
      $tokenExtractor: '@lexik_jwt_authentication.extractor.chain_extractor'
      $jwtEncoder: '@lexik_jwt_authentication.encoder' # <-- C'EST LA LIGNE À CHANGER
      $userProvider: '@security.user.provider.concrete.app_user_provider'

  App\EventListener\LogoutListener:
    tags: ['kernel.event_subscriber']

  App\EventSubscriber\JWTCreatedSubscriber: ~
  App\EventSubscriber\UserRegistrationSubscriber:
    tags: ['kernel.event_subscriber']
  App\EventListener\JwtCookieListener:
    tags:
      - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: 10 }
    public: true
  App\EventListener\JWTTokenFromCookieListener:
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 300 }
  # App\EventListener\:
  #   resource: '../src/EventListener'
  #   exclude: '../src/EventListener/JwtCookieListener.php' # Exclure celui que vous avez défini spécifiquement
  #   autowire: true
  #   autoconfigure: true
  App\DataPersister\UserDataPersister: 
    arguments:
      $frontendUrl: '%env(FRONTEND_URL)%' 

  App\Repository\:
    resource: "../src/Repository"
    tags: ["doctrine.repository_service"]
  App\Controller\:
    resource: "../src/Controller"
    exclude: "../src/Controller/{Debugger,Tests,Test}"
    public: true # Rend le contrôleur public
  App\Service\:
    resource: "../src/Service/*"
    public: false
  
  App\Encoder\MultipartDecoder:
    arguments:
      $requestStack: "@request_stack"
    tags:
      - { name: "serializer.encoder", priority: 10 }
  App\Serializer\PhotoDenormalizer:
    tags:
      - { name: "serializer.denormalizer", priority: 100 }
  App\Serializer\PhotoNormalizer:
    arguments:
      - "@api_platform.jsonld.normalizer.item"
      - "@vich_uploader.storage"
    tags:
      - { name: "serializer.normalizer", priority: 100 }
  App\Repository\WalkRepository:
    tags: ["doctrine.repository_service"]

  # App\Repository\RefreshTokenRepository:
  #       autowire: true
  #       autoconfigure: true
