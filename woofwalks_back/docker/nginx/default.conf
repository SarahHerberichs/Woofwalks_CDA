# Redirection HTTP vers HTTPS
server {
    listen 80;                        # Écoute sur le port 80 (HTTP)
    server_name localhost;            # Nom du serveur, ici "localhost"
    
    return 301 https://$host$request_uri;  # Redirige tout le trafic HTTP vers HTTPS avec un code 301 (permanent)
}

# Serveur HTTPS
server {
    listen 443 ssl;                   # Écoute sur le port 443 avec SSL (HTTPS)
    server_name localhost;            # Nom du serveur
    root /var/www/html/public;        # Répertoire racine du site

    fastcgi_hide_header X-Powered-By; # Cache l’en-tête X-Powered-By pour ne pas divulguer la version PHP

    # SSL
    ssl_certificate /etc/nginx/certs/nginx.crt;       # Chemin vers le certificat SSL
    ssl_certificate_key /etc/nginx/certs/nginx.key;   # Chemin vers la clé privée SSL
    ssl_protocols TLSv1.2 TLSv1.3;                    # Protocoles TLS autorisés
    ssl_prefer_server_ciphers on;                     # Priorité aux chiffrements définis par le serveur
    ssl_ciphers HIGH:!aNULL:!MD5;                     # Cipher suites autorisées (sécurisées)

    # Gestion des requêtes
    location / {
        try_files $uri /index.php$is_args$query_string;  
        # Essaie de servir le fichier demandé, sinon redirige vers index.php
        # $is_args$query_string permet de passer les paramètres GET
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass woofwalks_php-fpm:9000;         # Passe les requêtes PHP au service PHP-FPM
        fastcgi_split_path_info ^(.+\.php)(/.*)$;    # Sépare le script PHP et le chemin PATH_INFO
        include fastcgi_params;                       # Inclut les paramètres FastCGI par défaut
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;  # Définit le chemin du script PHP
        fastcgi_param DOCUMENT_ROOT $realpath_root;  # Définit la racine du document pour PHP
        internal;                                     # Rend cette location interne (non accessible directement)
    }

    # Sécurité
    add_header X-Content-Type-Options nosniff always;  
        # Empêche le navigateur de deviner le type MIME (protection contre certaines attaques)
    add_header X-Frame-Options DENY always;            
        # Empêche le site d’être chargé dans un <iframe> (protection clickjacking)
    add_header X-XSS-Protection "1; mode=block" always;  
        # Active le filtre XSS des navigateurs (anciennes protections, certaines dépassées)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none';" always;  
        # Définit une politique CSP pour contrôler quelles sources de contenu sont autorisées
        # 'self' = uniquement le même domaine
        # data: = permet les images encodées en base64
        # object-src 'none' = interdit les plugins comme Flash
        # frame-ancestors 'none' = interdit à tout site d’inclure ce site en iframe
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;  
        # Empêche le cache du navigateur pour garantir des contenus toujours frais

    # Logs
    server_tokens off;                       # N'affiche pas la version de Nginx dans les réponses d'erreur
    error_log /var/log/nginx/error.log;      # Fichier de log des erreurs
    access_log /var/log/nginx/access.log;    # Fichier de log des accès
}
