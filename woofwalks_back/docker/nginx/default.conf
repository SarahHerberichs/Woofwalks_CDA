# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
    add_header Content-Security-Policy "default-src 'self';" always;
}

# Serveur HTTPS
server {
    listen 443 ssl;
    server_name localhost;
    root /var/www/html/public;

    fastcgi_hide_header X-Powered-By;

    # SSL
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gestion des requêtes
    location / {
        try_files $uri /index.php$is_args$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass woofwalks_php-fpm:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Sécurité
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none';" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

    # Logs
    server_tokens off;
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
