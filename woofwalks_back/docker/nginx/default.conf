
# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

# Serveur HTTPS
server {
    listen 443 ssl;
    server_name localhost;

    # SSL
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;


    # -------------------------
    # FRONTEND (React buildé)
    # -------------------------
    root /usr/share/nginx/html;   # <-- le dossier où tu montes ton build React

    location / {
        index index.html;
        try_files $uri /index.html;
    }

    # -------------------------
    # BACKEND (Symfony API)
    # -------------------------
    location /api {
        root /var/www/html/public;     # <-- Symfony est monté ici
        try_files $uri /index.php$is_args$query_string;
    }
    location /media/ {
        alias /var/www/html/public/media/;
        access_log off;
        expires 30d;
    }
    location ~ ^/index\.php(/|$) {
        fastcgi_pass woofwalks_php-fpm:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        internal;
    }


    # -------------------------
    # Sécurité
    # -------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api-adresse.data.gouv.fr; media-src 'self'; object-src 'none'; frame-ancestors 'none';" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api-adresse.data.gouv.fr; media-src 'self'; object-src 'none'; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self'; form-action 'self';" always;


    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

    fastcgi_hide_header X-Powered-By;

    server_tokens off;
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
